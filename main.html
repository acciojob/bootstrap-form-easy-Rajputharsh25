<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Internship Form</title>

<!-- Bootstrap CSS -->
<link rel="stylesheet"
href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<!-- Custom CSS -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5 mb-5">

    <div class="card p-4">

        <h2 class="text-center mb-4">Internship Form</h2>

        <form class="needs-validation" novalidate>

            <div class="form-row">

                <!-- First Name -->
                <div class="form-group col-md-4">
                    <label>First Name</label>
                    <input type="text"
                           class="form-control"
                           id="first-name-input"
                           required>

                    <div class="invalid-feedback">
                        First name required!
                    </div>
                </div>

                <!-- Last Name -->
                <div class="form-group col-md-4">
                    <label>Last Name</label>
                    <input type="text"
                           class="form-control"
                           id="last-name-input"
                           required>

                    <div class="invalid-feedback">
                        Last name required!
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group col-md-4">
                    <label>Email Address</label>
                    <input type="email"
                           class="form-control"
                           id="email-input"
                           placeholder="xyz@abc.com"
                           required>

                    <div class="invalid-feedback">
                        Email required!
                    </div>
                </div>

            </div>

            <div class="form-row">

                <!-- College -->
                <div class="form-group col-md-6">
                    <label>College</label>
                    <input type="text"
                           class="form-control"
                           id="college-input"
                           required>

                    <div class="invalid-feedback">
                        Please provide a valid college.
                    </div>
                </div>

                <!-- Graduation Year -->
                <div class="form-group col-md-3">
                    <label>Graduation Year</label>

                    <select class="form-control"
                            id="graduation-year-input"
                            required>

                        <option value="">Choose...</option>
                        <option>2020</option>
                        <option>2021</option>
                        <option>2022</option>
                        <option>2023</option>

                    </select>

                    <div class="invalid-feedback">
                        Please select a valid Graduation Year.
                    </div>
                </div>

                <!-- Roll No -->
                <div class="form-group col-md-3">
                    <label>Roll No.</label>
                    <input type="text"
                           class="form-control"
                           id="roll-no-input"
                           required>

                    <div class="invalid-feedback">
                        Please provide a valid Roll no.
                    </div>
                </div>

            </div>

            <!-- Checkbox -->
            <div class="form-group form-check">
                <input type="checkbox"
                       class="form-check-input"
                       id="conditions-checkbox"
                       required>

                <label class="form-check-label">
                    Agree to terms and conditions
                </label>

                <div class="invalid-feedback">
                    You must agree before submitting.
                </div>
            </div>

            <!-- Submit Button -->
            <button class="btn btn-primary" type="submit">
                Submit form
            </button>

        </form>

    </div>

</div>

<!-- Bootstrap Validation Script -->
<script>
(function () {
'use strict';

window.addEventListener('load', function () {

var forms = document.getElementsByClassName('needs-validation');

var validation = Array.prototype.filter.call(forms, function (form) {

form.addEventListener('submit', function (event) {

if (form.checkValidity() === false) {
event.preventDefault();
event.stopPropagation();
}

form.classList.add('was-validated');

}, false);

});

}, false);
})();
</script>

</body>
</html>
